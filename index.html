<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus &mdash; IT Solutions, NexLock &amp; NexWarranty</title>
    <meta
      name="description"
      content="Nexus is a technology company. Nexus IT Solutions builds and maintains software for businesses; NexLock and NexWarranty are Nexus's own products."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Nexus page loader — shared by the boot loader below and the React
         route-change loader (src/components/PageLoader.jsx). */
      .nx-loader {
        position: fixed; inset: 0; z-index: 100000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background:
          radial-gradient(circle at 30% 20%, rgba(6, 182, 212, 0.14), transparent 45%),
          radial-gradient(circle at 75% 80%, rgba(236, 72, 153, 0.1), transparent 45%),
          #f4f6fc;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      .nx-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .nx-loader__mark { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
      .nx-loader__ring {
        position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, #06b6d4 120deg, #4f46e5 240deg, #ec4899 330deg, transparent 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: nx-spin 1.1s linear infinite;
      }
      .nx-loader__halo {
        position: absolute; inset: 10px; border-radius: 50%; background: #fff;
        box-shadow: 0 12px 30px rgba(9, 33, 71, 0.12), inset 0 0 0 1px rgba(9, 33, 71, 0.06);
        animation: nx-breathe 1.8s ease-in-out infinite;
      }
      .nx-loader__logo { position: relative; width: 58px; height: 58px; }
      .nx-loader__word {
        font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 700; font-size: 1.15rem;
        letter-spacing: 0.42em; padding-left: 0.42em; color: #092147;
      }
      .nx-loader__bar { width: 140px; height: 2px; border-radius: 2px; background: rgba(9, 33, 71, 0.08); overflow: hidden; }
      .nx-loader__bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, #4f46e5, #06b6d4);
        animation: nx-sweep 1.1s ease-in-out infinite;
      }
      @keyframes nx-spin { to { transform: rotate(360deg); } }
      @keyframes nx-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.96); } }
      @keyframes nx-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .nx-loader__ring, .nx-loader__halo, .nx-loader__bar::after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" class="nx-loader" role="status" aria-label="Loading Nexus">
      <div class="nx-loader__mark">
        <div class="nx-loader__ring"></div>
        <div class="nx-loader__halo"></div>
        <img class="nx-loader__logo" src="/favicon-180.png" alt="" />
      </div>
      <div class="nx-loader__word">NEXUS</div>
      <div class="nx-loader__bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
